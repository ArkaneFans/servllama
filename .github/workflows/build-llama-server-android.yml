name: Build llama-server for Android

on:
  workflow_dispatch:
    inputs:
      llama_cpp_tag:
        description: llama.cpp tag to build. The Hexagon patch matches v0.4.1.
        required: true
        default: v0.4.1
        type: string

permissions:
  contents: read

concurrency:
  group: llama-server-android-${{ github.ref }}-${{ inputs.llama_cpp_tag }}
  cancel-in-progress: false

env:
  ANDROID_ABI: arm64-v8a
  SNAPDRAGON_IMAGE: ghcr.io/snapdragon-toolchain/arm64-android:v0.7

jobs:
  build-arm64:
    name: Android arm64 Snapdragon (${{ inputs.llama_cpp_tag }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out ServLlama
        uses: actions/checkout@v4

      - name: Check out llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_cpp_tag }}
          fetch-depth: 1
          fetch-tags: true
          path: llama.cpp

      - name: Record llama.cpp source revision
        id: source
        shell: bash
        env:
          LLAMA_CPP_TAG: ${{ inputs.llama_cpp_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${LLAMA_CPP_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "Invalid llama.cpp tag: ${LLAMA_CPP_TAG}" >&2
            exit 1
          fi

          if ! git -C llama.cpp tag --points-at HEAD | grep -Fxq "${LLAMA_CPP_TAG}"; then
            echo "The checked-out revision is not tagged ${LLAMA_CPP_TAG}." >&2
            exit 1
          fi

          commit="$(git -C llama.cpp rev-parse HEAD)"
          safe_tag="$(printf '%s' "${LLAMA_CPP_TAG}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"

          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "safe_tag=${safe_tag}" >> "${GITHUB_OUTPUT}"

          {
            echo "## llama.cpp source"
            echo
            echo "- Tag: \`${LLAMA_CPP_TAG}\`"
            echo "- Commit: \`${commit}\`"
            echo "- Toolchain image: \`${SNAPDRAGON_IMAGE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/lib/heroku \
            || true
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Apply Hexagon patch and ServLlama preset
        shell: bash
        run: |
          set -euo pipefail

          # git -C changes directory before opening the patch, so a workspace-relative path would miss.
          patch="${GITHUB_WORKSPACE}/patches/llama.cpp/0001-hexagon-skip-unsupported-devices.patch"
          preset="${GITHUB_WORKSPACE}/patches/llama.cpp/CMakeUserPresets.servllama.json"
          test -f "${patch}"
          test -f "${preset}"

          if ! git -C llama.cpp apply --check "${patch}"; then
            echo "The Hexagon patch did not apply to ${{ inputs.llama_cpp_tag }}." >&2
            echo "It is written for llama.cpp v0.4.1." >&2
            exit 1
          fi
          git -C llama.cpp apply "${patch}"
          cp "${preset}" llama.cpp/CMakeUserPresets.json
          test -s llama.cpp/CMakeUserPresets.json

      - name: Build in the Snapdragon toolchain image
        shell: bash
        env:
          SAFE_TAG: ${{ steps.source.outputs.safe_tag }}
        run: |
          set -euo pipefail

          docker pull --platform linux/amd64 "${SNAPDRAGON_IMAGE}"

          bundle_name="llama-server-${SAFE_TAG}-android-${ANDROID_ABI}"
          jni_dir="${GITHUB_WORKSPACE}/dist/${bundle_name}/android/app/src/main/jniLibs/${ANDROID_ABI}"
          mkdir -p "${jni_dir}" "$(dirname "${GITHUB_WORKSPACE}/dist/snapdragon-toolchain.env")"

          docker run --rm \
            --platform linux/amd64 \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e "DEST_JNI=/src/dist/${bundle_name}/android/app/src/main/jniLibs/${ANDROID_ABI}" \
            -e TOOLCHAIN_ENV_OUT=/src/dist/snapdragon-toolchain.env \
            -v "${GITHUB_WORKSPACE}:/src" \
            "${SNAPDRAGON_IMAGE}" \
            bash /src/patches/llama.cpp/build_snapdragon_android.sh /src/llama.cpp

          echo "bundle_name=${bundle_name}" >> "${GITHUB_ENV}"
          echo "jni_dir=${jni_dir}" >> "${GITHUB_ENV}"

      - name: Package and verify the archive
        id: bundle
        shell: bash
        env:
          LLAMA_CPP_TAG: ${{ inputs.llama_cpp_tag }}
          LLAMA_CPP_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail

          bundle_root="${GITHUB_WORKSPACE}/dist/${bundle_name}"
          jni_dir="${jni_dir}"
          manifest_dir="${bundle_root}/assets/bin"
          meta="${GITHUB_WORKSPACE}/dist/snapdragon-toolchain.env"

          test -f "${jni_dir}/libllama-server.so"
          test -f "${jni_dir}/libggml-opencl.so"
          test -f "${jni_dir}/libggml-hexagon.so"
          test -f "${jni_dir}/libggml-htp-v73.so"
          test -f "${jni_dir}/libggml-htp-v75.so"
          test -f "${jni_dir}/libggml-htp-v79.so"
          test -f "${jni_dir}/libggml-htp-v81.so"
          test -f "${meta}"
          # shellcheck disable=SC1090
          source "${meta}"

          android_api="$(sed -n 's/.*"ANDROID_PLATFORM"[[:space:]]*:[[:space:]]*"android-\([0-9][0-9]*\)".*/\1/p' \
            patches/llama.cpp/CMakeUserPresets.servllama.json | head -n 1)"
          test -n "${android_api}"

          image_digest="$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' "${SNAPDRAGON_IMAGE}" || true)"
          ndk_version="$(basename "${ANDROID_NDK_ROOT}")"

          mkdir -p "${manifest_dir}"
          chmod 755 "${jni_dir}/libllama-server.so"

          cat > "${manifest_dir}/llama_server_manifest.json" <<EOF
          {
            "version": "${LLAMA_CPP_TAG}+hexagon-skip-unsupported"
          }
          EOF

          cat > "${bundle_root}/BUILD_INFO.json" <<EOF
          {
            "llamaCppTag": "${LLAMA_CPP_TAG}",
            "llamaCppCommit": "${LLAMA_CPP_COMMIT}",
            "androidAbi": "${ANDROID_ABI}",
            "androidApiLevel": ${android_api},
            "toolchainImage": "${SNAPDRAGON_IMAGE}",
            "toolchainDigest": "${image_digest}",
            "ndkRoot": "${ANDROID_NDK_ROOT}",
            "ndkVersion": "${ndk_version}",
            "hexagonSdkRoot": "${HEXAGON_SDK_ROOT}",
            "hexagonToolsRoot": "${HEXAGON_TOOLS_ROOT}",
            "patch": "0001-hexagon-skip-unsupported-devices",
            "backends": ["cpu", "opencl", "hexagon"],
            "buildType": "Release"
          }
          EOF

          cp "${GITHUB_WORKSPACE}/llama.cpp/LICENSE" "${bundle_root}/LLAMA_CPP_LICENSE"

          (
            cd "${bundle_root}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          archive="${GITHUB_WORKSPACE}/dist/${bundle_name}.tar.gz"
          tar -czf "${archive}" -C "${bundle_root}" .

          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "bundle_name=${bundle_name}" >> "${GITHUB_OUTPUT}"

          {
            echo
            echo "## Android artifact"
            echo
            echo "- ABI: \`${ANDROID_ABI}\`"
            echo "- Minimum Android API: \`${android_api}\`"
            echo "- Toolchain: \`${SNAPDRAGON_IMAGE}\`"
            echo "- Archive: \`${bundle_name}.tar.gz\`"
            echo
            echo "The archive contains directories that can be copied directly over the ServLlama repository."
            echo "\`libggml-htp-*.so\` are Hexagon ELF files and are not NDK-stripped."
            echo
            echo "### Bundled native files"
            echo
            find "${jni_dir}" -maxdepth 1 -type f -printf '%f\n' | sort | sed 's/^/- `/' | sed 's/$/`/'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload llama-server bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.bundle_name }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.bundle.outputs.archive }}
